# Release/arch matrix. The "supported" column is what the official channel
# actually publishes; everything else in this table is a filename alias for the
# same payload, not a separate build.
#   OpenWrt target/subtarget        release line      payload arch
#   x86/64                          19.07 .. 25.5     x86_64
#   armsr/armv8, armvirt/64         19.07 .. 25.5     arm64
#   oxnas, bcm27xx/bcm2711, ...     any               arm64
#
# Unsupported (no official payload exists for these at all):
#   mips_24kc/mips_74kc (MT7621, BCM47xx), mips64, armv7 (armv8-32bit, kirkwood,
#   bcm53xx, most consumer Wi-Fi routers), riscv64, arc, x86/generic (32-bit).
UNSUPPORTED_ARCH_NOTE="no official binary; the CLI cannot be packaged for this arch"

# ipk Architecture values per payload arch. opkg installs a package only when
# its Architecture matches one of the device's `opkg print-architecture` entries,
# so the same arm64 payload is relabelled for the common subtarget arch names.
declare -A ARCH_IPK_LABELS=(
  [x86_64]="x86_64"
  [arm64]="aarch64_generic aarch64_cortex_a53 aarch64_cortex_a72 aarch64_corelr8a"
)

# OpenWrt release lines this matrix was written against. The ipk itself does not
# depend on the release; it depends on musl + the arch (see README).
# Checked against downloads.openwrt.org/releases on 2026-11-13, where the stable
# series are 19.07, 21.02, 22.03, 23.05, 24.10 and 25.12 - there is no 25.5.
RELEASE_LINES="19.07 21.02 22.03 23.05 24.10 25.12 snapshot"

# Payload arch -> PT_INTERP that must be present on the device.
declare -A EXPECTED_INTERP=(
  [x86_64]="/lib/ld-musl-x86_64.so.1"
  [arm64]="/lib/ld-musl-aarch64.so.1"
)

# Free space required, in KiB, beyond the uncompressed binary size.
SPACE_MARGIN_KIB=$((1024 * 64))

# Default runtime capacity for the remote-control daemon. One session costs
# roughly 300-350 MB RSS, so the upstream default (32) is never usable on a
# router or an SBC.
DEFAULT_CAPACITY=1
DEFAULT_SPAWN=same-dir
DEFAULT_DIR=/root
