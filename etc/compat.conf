# The closed compat layer: which libstdc++ symbols old OpenWrt rootfses can be
# missing, and what the shipped shim must look like.
#
# COMPAT_SYMBOLS must equal the exports of compat/<arch>/libqoder-compat.so;
# bin/build.sh refuses the build on any mismatch, in either direction, so this
# file cannot drift away from the binary.

COMPAT_SYMBOLS=_ZSt21__glibcxx_assert_failPKciS0_S0_

# The shim exists to make a loader failure diagnosable and survivable, not to
# grow into a second C++ runtime. Alpine's musl libstdc++ is 2.75 MB and was
# rejected on package-size grounds; anything approaching it is a build error.
MAX_SHIM_BYTES=8192

# Installed into the ipk at this path, next to the payload's own libexec dir.
COMPAT_INSTALL_PATH=compat/libqoder-compat.so

# The marker the payload install writes when this rootfs needs the shim; the
# launcher and the wrapper preload only when it exists.
COMPAT_MARKER_NAME=compat.on

SHA256_arm64=28911a8d719fe1f83472b431e8aa886d7227d071ba77e82bef508fa3b60484a5
