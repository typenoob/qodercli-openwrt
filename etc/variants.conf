# Two official channels, two different binaries. Verified by diffing the two
# install.sh files: they differ only in BASE_URL, DISPLAY_NAME and bin_name.
#   curl -fsSL https://qoder.com/install    -> .../qodercli/install.sh
#   curl -fsSL https://qoder.com.cn/install -> static.qoder.com.cn/qoder-cli-cn/install.sh
declare -A V_BASE_URL=(
  [qoder]="https://qoder-ide.oss-accelerate.aliyuncs.com/qodercli"
  [qoderclicn]="https://static.qoder.com.cn/qoder-cli-cn"
)

declare -A V_BIN_NAME=(
  [qoder]="qodercli"
  [qoderclicn]="qoderclicn"
)

# Manifest arch token used in the release filename: qodercli-linux-<token>-musl.tar.gz
declare -A V_MANIFEST_ARCH=(
  [x86_64]="amd64-musl"
  [arm64]="arm64-musl"
)

declare -A V_FILE_PREFIX=(
  [x86_64]="linux-x64-musl"
  [arm64]="linux-arm64-musl"
)

declare -A V_DISPLAY=(
  [qoder]="Qoder CLI"
  [qoderclicn]="Qoder CLI CN"
)

# Environment variables the daemon exports the token under, most authoritative
# first. Measured on a device, not copied from a manual: with
# QODER_PERSONAL_ACCESS_TOKEN set the CN build still answers "Not logged in",
# while QODERCN_DEVICE_TOKEN gets as far as "HTTP 401: invalid token", so the
# editions do not share one name. The extra aliases cost one export each and
# keep a rename upstream from silently logging every router out.
declare -A V_TOKEN_ENV=(
  [qoder]="QODER_PERSONAL_ACCESS_TOKEN QODER_DEVICE_TOKEN"
  [qoderclicn]="QODERCN_DEVICE_TOKEN QODER_PERSONAL_ACCESS_TOKEN QODER_DEVICE_TOKEN"
)

# The glibc channels are also published (amd64 / amd64-baseline / arm64). They
# are usable only on a device that actually ships the matching loader, which a
# stock OpenWrt image does not. Kept behind a flag so nobody packages them by
# accident.
declare -A GLIBC_FILE_PREFIX=(
  [x86_64]="linux-x64"
  [arm64]="linux-arm64"
)
